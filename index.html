<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Countdown</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #fff;
      color: #111;
    }

    body {
      display: grid;
      place-items: center;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    .timer {
      container-type: inline-size;
      width: min(100% - 2rem, 48rem);
      min-width: 0;
      justify-self: center;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      column-gap: clamp(0.35rem, 2cqw, 2.5rem);
      font-variant-numeric: tabular-nums;
    }

    .unit {
      font-size: clamp(1.7rem, 15cqw, 8rem);
      text-align: center;
    }

    .num {
      font-size: 1em;
      font-weight: 420;
      letter-spacing: -0.045em;
      line-height: 1;
    }

    .label {
      margin-top: 0.45em;
      font-size: min(0.2em, 0.7rem);
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #9a9a9a;
    }
  </style>
</head>
<body>
  <div class="timer" role="timer" aria-live="polite" aria-atomic="true">
    <div class="unit"><div class="num" id="days">00</div><div class="label">Days</div></div>
    <div class="unit"><div class="num" id="hours">00</div><div class="label">Hours</div></div>
    <div class="unit"><div class="num" id="minutes">00</div><div class="label">Minutes</div></div>
    <div class="unit"><div class="num" id="seconds">00</div><div class="label">Seconds</div></div>
  </div>
  <script>
    // 11:00 a.m. Eastern on Oct 23, 2026. That morning is still daylight time (UTC−4).
    const END = Date.parse("2026-10-23T11:00:00-04:00");
    const pad = (n) => String(n).padStart(2, "0");
    const els = ["days", "hours", "minutes", "seconds"].map((id) => document.getElementById(id));

    function tick() {
      const left = Math.max(0, END - Date.now());
      const total = Math.floor(left / 1000);
      const parts = [
        Math.floor(total / 86400),
        Math.floor((total % 86400) / 3600),
        Math.floor((total % 3600) / 60),
        total % 60,
      ];
      for (let i = 0; i < els.length; i++) els[i].textContent = pad(parts[i]);
    }

    tick();
    setInterval(tick, 250);
  </script>
</body>
</html>
